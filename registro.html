<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - GastroSur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="fondo-salud">

<div class="container mt-5 mb-5">
    <div class="card shadow p-4" style="max-width: 600px; margin: 0 auto;">
        <h4 class="text-primary mb-4 fw-bold">Registro de Usuario</h4>

        <form id="formRegistro">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="txtNombres" class="form-label">Nombres</label>
                    <input type="text" id="txtNombres" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="txtApellidos" class="form-label">Apellidos</label>
                    <input type="text" id="txtApellidos" class="form-control" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="numCedula" class="form-label">Cédula de Ciudadanía</label>
                <input type="number" id="numCedula" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="dateNacimiento" class="form-label">Fecha de Nacimiento</label>
                <input type="date" id="dateNacimiento" class="form-control" required>
            </div>

            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-primary">Guardar Usuario</button>
                <a href="inicio.html" class="btn btn-light">Volver al inicio</a>
            </div>
        </form>
    </div>
</div>

<script>
    document.getElementById('formRegistro').addEventListener('submit', function(event) {
        event.preventDefault(); // Evita que la página intente buscar un servidor ausente.

        // Simula la persistencia local de la información de manera exitosa
        alert('Usuario registrado exitosamente en el sistema GastroSur.');

        // Redirección limpia al Login tras aceptar la alerta
        window.location.href = "inicio.html";
    });
</script>
</body>
</html>
