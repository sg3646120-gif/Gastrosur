<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - GastroSur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="fondo-salud">

<div class="container mt-5 mb-5">
    <div class="card shadow p-4" style="max-width: 600px; margin: 0 auto;">
        <h4 class="text-primary mb-4 fw-bold">Registro de Usuario</h4>

        <form id="formRegistro">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="txtNombres" class="form-label">Nombres</label>
                    <input type="text" id="txtNombres" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="txtApellidos" class="form-label">Apellidos</label>
                    <input type="text" id="txtApellidos" class="form-control" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="numCedula" class="form-label">Cédula de Ciudadanía</label>
                <input type="number" id="numCedula" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="dateNacimiento" class="form-label">Fecha de Nacimiento</label>
                <input type="date" id="dateNacimiento" class="form-control" required>
            </div>

            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-primary">Guardar Usuario</button>
                <a href="inicio.html" class="btn btn-light">Volver al inicio</a>
            </div>
        </form>
    </div>
</div>

<script>
// Credenciales de Supabase
const SUPABASE_URL = "https://oduitmaxnoblxavmeeap.supabase.co";
const SUPABASE_KEY = "sb_publishable_LSOqYixK8gPTK4yAEKSuBw_mQpD_lli";

// Escuchamos el evento de envío del formulario
document.addEventListener('DOMContentLoaded', function() {
    const formulario = document.querySelector('form') || document.getElementById('formRegistro');
    if (formulario) {
        formulario.addEventListener('submit', procesarRegistro);
    }
});

async function procesarRegistro(event) {
    event.preventDefault();

    // Capturamos los campos de entrada
    const inputs = document.querySelectorAll('input');
    
    let nombres = inputs[0] ? inputs[0].value.trim() : "";
    let apellidos = inputs[1] ? inputs[1].value.trim() : "";
    let cedula = inputs[2] ? inputs[2].value.trim() : "";

    let contenedorMensaje = document.getElementById("contenedorError") || document.getElementById("contenedorMensaje");

    if (!contenedorMensaje) {
        contenedorMensaje = document.createElement('div');
        contenedorMensaje.id = 'contenedorMensaje';
        document.querySelector('.card').appendChild(contenedorMensaje);
    }

    contenedorMensaje.innerHTML = "";

    if (nombres === "" || cedula === "") {
        mostrarMensaje(contenedorMensaje, "Debe ingresar al menos Nombres y Cédula", "danger");
        return;
    }

    try {
        // Petición POST a la API REST de Supabase en la tabla pacientes
        const respuesta = await fetch(`${SUPABASE_URL}/rest/v1/pacientes`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${SUPABASE_KEY}`,
                'Prefer': 'return=minimal'
            },
            body: JSON.stringify({
                nombre: `${nombres} ${apellidos}`.trim(),
                documento: cedula,
                email: ""
            })
        });

        if (respuesta.ok) {
            mostrarMensaje(contenedorMensaje, "¡Usuario registrado con éxito!", "success");
            document.querySelectorAll('input').forEach(input => input.value = '');
        } else {
            const err = await respuesta.json();
            mostrarMensaje(contenedorMensaje, "Error al registrar: " + (err.message || "No se pudo guardar"), "danger");
        }
    } catch (error) {
        mostrarMensaje(contenedorMensaje, "Error de red/conexión: " + error.message, "danger");
    }
}

function mostrarMensaje(contenedor, mensaje, tipo) {
    contenedor.innerHTML = `<div class="alert alert-${tipo} mt-3 mb-0" role="alert">${mensaje}</div>`;
}
</script>
</body>
</html>
