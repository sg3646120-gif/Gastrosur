<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GastroSur - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="fondo-salud">

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card login-card shadow-lg p-4" style="max-width: 400px; width: 100%;">

        <div class="text-center mb-3">
            <svg width="80" height="80" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="#0d6efd"/>
                <path d="M35 30 Q50 10 65 30 Q75 50 50 80 Q25 50 35 30" fill="white"/>
            </svg>
            <h3 class="mt-3 fw-bold text-primary">GastroSur</h3>
            <small class="text-muted">Plataforma de Resultados Endoscópicos</small>
        </div>

        <form id="formLogin">
            <div class="mb-3">
                <label for="txtUsuario" class="form-label">Usuario</label>
                <input type="text" id="txtUsuario" class="form-control" placeholder="Ej: admin">
            </div>

            <div class="mb-3">
                <label for="txtClave" class="form-label">Contraseña</label>
                <input type="password" id="txtClave" class="form-control" placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-3">Iniciar Sesión</button>
            <a href="registro.html" class="btn btn-outline-primary w-100 mt-2">Registrar usuario</a>
        </form>

        <div id="contenedorError"></div>
    </div>
</div>

<script>
// Configuración de Supabase
const SUPABASE_URL = "https://oduitmaxnoblxavmeeap.supabase.co";
const SUPABASE_KEY = "sb_publishable_LSOqYixK8gPTK4yAEKSuBw_mQpD_lli";

document.getElementById('formLogin').addEventListener('submit', async function(event) {
    event.preventDefault();

    let usuario = document.getElementById("txtUsuario").value.trim();
    let clave = document.getElementById("txtClave").value.trim();
    let contenedorError = document.getElementById("contenedorError");

    contenedorError.innerHTML = "";

    if (usuario === "" || clave === "") {
        mostrarError("Debe ingresar usuario y contraseña");
        return;
    }

    try {
        // Consultamos en Supabase si el usuario existe (revisa la tabla pacientes o la de usuarios)
        const respuesta = await fetch(`${SUPABASE_URL}/rest/v1/pacientes?documento=eq.${usuario}`, {
            method: 'GET',
            headers: {
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${SUPABASE_KEY}`
            }
        });

        const datos = await respuesta.json();

        if (respuesta.ok && datos.length > 0) {
            // Usuario encontrado en la nube
            window.location.href = "dashboard.html";
        } else {
            mostrarError("Usuario o documento no encontrado en el sistema");
        }
    } catch (error) {
        mostrarError("Error de conexión con la base de datos");
    }
});

function mostrarError(mensaje) {
    let contenedor = document.getElementById("contenedorError");
    contenedor.innerHTML = `<div class="alert alert-danger mt-3 mb-0" role="alert">${mensaje}</div>`;
}
</script>
</body>
</html>
